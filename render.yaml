services:
  - type: web
    name: legalgen-scanner
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCANNER_API_KEY
        generateValue: true
      - key: BROWSERLESS_API_KEY
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: NPM_CONFIG_LOGLEVEL
        value: "warn"
      - key: npm_config_package_manager
        value: "npm"