services:
  - type: web
    name: legalgen-scanner
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCANNER_API_KEY
        generateValue: true
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"